[project]
name = "constella-gpu"
version = "0.1.1"
description = "Lightweight realtime heterogeneous accelerator monitoring with workload history."
readme = "PYPI.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["gpu", "nvidia", "ascend", "monitoring", "textual", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.116.0",
    "pyyaml>=6.0.0",
    "textual>=8.0.0,<9",
    "uvicorn[standard]>=0.35.0",
    "websockets>=13.0",
]

[project.urls]
Homepage = "https://pypi.org/project/constella-gpu/"
Repository = "https://github.com/kuma-loong/Constella"
Documentation = "https://github.com/kuma-loong/Constella#readme"
Issues = "https://github.com/kuma-loong/Constella/issues"

[project.scripts]
constella = "constella.cli:main"
constella-tui = "constella_tui.app:main"

[project.urls]
Homepage = "https://github.com/kuma-loong/Constella"
Documentation = "https://github.com/kuma-loong/Constella#readme"
Issues = "https://github.com/kuma-loong/Constella/issues"
Repository = "https://github.com/kuma-loong/Constella.git"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constella", "tui/constella_tui"]
artifacts = ["src/constella/frontend/dist/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/PYPI.md",
    "/README.md",
    "/README_zh.md",
    "/docs",
    "/frontend",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
    "/tui",
    "/uv.lock",
]
artifacts = ["src/constella/frontend/dist/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
