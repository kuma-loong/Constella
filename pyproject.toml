[project]
name = "constella-gpu"
version = "0.1.3rc1"
description = "Full Constella distribution with backend, Web UI, and terminal UI."
readme = "PYPI.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["gpu", "nvidia", "ascend", "monitoring", "textual", "tui", "web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "constella-gpu-tui==0.1.3rc1",
    "constella-gpu-web==0.1.3rc1",
]

[project.urls]
Homepage = "https://github.com/kuma-loong/Constella"
Repository = "https://github.com/kuma-loong/Constella"
Documentation = "https://github.com/kuma-loong/Constella#readme"
Issues = "https://github.com/kuma-loong/Constella/issues"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constella_gpu"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/CHANGELOG.md",
    "/PYPI.md",
    "/pyproject.toml",
    "/src/constella_gpu",
]

[tool.uv.workspace]
members = ["packages/backend", "packages/tui", "packages/web"]

[tool.uv.sources]
constella-gpu-backend = { workspace = true }
constella-gpu-tui = { workspace = true }
constella-gpu-web = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/backend/src", "packages/tui/src", "packages/web/src"]
