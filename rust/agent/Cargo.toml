[package]
name = "constella-agent"
version = "0.1.5"
edition = "2024"
[dependencies]
libc = "0.2"
libloading = "0.8"
csv = "1"
regex = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
constella-protocol = { path = "../protocol" }
nvml-wrapper = { version = "0.12", features = ["legacy-functions"] }
nvml-wrapper-sys = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "signal", "sync", "process", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
