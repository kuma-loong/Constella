<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Constella logo</title>
  <desc id="desc">Four connected stars held inside an open orbital C.</desc>
  <defs>
    <linearGradient id="orbit" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6078ba"/>
      <stop offset="1" stop-color="#3f5799"/>
    </linearGradient>
    <path id="star" d="m0-4 1.25 2.75L4 0 1.25 1.25 0 4-1.25 1.25-4 0l2.75-1.25Z"/>
  </defs>

  <style>
    .orbit { stroke: url(#orbit); }
    .link { stroke: #536bab; }
    .node { fill: #455e9f; }
    @media (prefers-color-scheme: dark) {
      .link { stroke: #a6b8ec; }
      .node { fill: #91a8e8; }
    }
  </style>

  <path class="orbit" d="M48.5 14.8A23.5 23.5 0 1 0 51 46.2" fill="none" stroke-width="6.5" stroke-linecap="round"/>
  <path class="link" d="M19.5 35.5 29 41l8.5-14 9 6" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="node">
    <use href="#star" transform="translate(19.5 35.5)"/>
    <use href="#star" transform="translate(29 41)"/>
    <use href="#star" transform="translate(37.5 27)"/>
    <use href="#star" transform="translate(46.5 33)"/>
  </g>
</svg>
