[project]
name = "constella-gpu-backend"
version = "0.1.3rc1"
description = "Constella accelerator monitoring backend, agents, and HTTP/WebSocket APIs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["gpu", "nvidia", "ascend", "monitoring", "api", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.116.0",
    "pyyaml>=6.0.0",
    "uvicorn[standard]>=0.35.0",
    "websockets>=13.0",
]

[project.urls]
Homepage = "https://github.com/kuma-loong/Constella"
Repository = "https://github.com/kuma-loong/Constella"
Documentation = "https://github.com/kuma-loong/Constella#readme"
Issues = "https://github.com/kuma-loong/Constella/issues"

[project.scripts]
constella = "constella.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constella"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/src/constella"]
