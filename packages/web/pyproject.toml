[project]
name = "constella-gpu-web"
version = "0.1.2"
description = "Constella backend with the production Web monitoring interface."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["gpu", "nvidia", "ascend", "monitoring", "web", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = ["constella-gpu-backend==0.1.2"]

[project.urls]
Homepage = "https://github.com/kuma-loong/Constella"
Repository = "https://github.com/kuma-loong/Constella"
Documentation = "https://github.com/kuma-loong/Constella#readme"
Issues = "https://github.com/kuma-loong/Constella/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constella_web"]
artifacts = ["src/constella_web/dist/**"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/src/constella_web"]
artifacts = ["src/constella_web/dist/**"]
