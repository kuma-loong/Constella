[project]
name = "constella-gpu-lab"
version = "0.1.5"
description = "Constella lab identity, authorization, and Linux account binding edition."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["gpu", "lab", "cloudflare-access", "identity", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "constella-gpu-backend==0.1.5",
    "pyjwt[crypto]>=2.10.0,<3",
]

[project.urls]
Homepage = "https://github.com/kuma-loong/Constella"
Repository = "https://github.com/kuma-loong/Constella"
Documentation = "https://github.com/kuma-loong/Constella/blob/main/docs/LAB_DEPLOYMENT.md"
Issues = "https://github.com/kuma-loong/Constella/issues"

[project.scripts]
constella-lab = "constella_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constella_lab"]
artifacts = ["src/constella_lab/dist/**"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/src/constella_lab"]
artifacts = ["src/constella_lab/dist/**"]
