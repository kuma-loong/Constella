[project]
name = "constella-gpu-tui"
version = "0.1.3"
description = "Standalone keyboard-first Textual client for a remote Constella service."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["gpu", "nvidia", "ascend", "monitoring", "textual", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "textual>=8.0.0,<9",
    "websockets>=13.0",
]

[project.urls]
Homepage = "https://github.com/kuma-loong/Constella"
Repository = "https://github.com/kuma-loong/Constella"
Documentation = "https://github.com/kuma-loong/Constella/blob/main/packages/tui/README.md"
Issues = "https://github.com/kuma-loong/Constella/issues"

[project.scripts]
constella-tui = "constella_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constella_tui"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/src/constella_tui"]
